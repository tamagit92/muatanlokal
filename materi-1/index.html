<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi 1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */
.header{
    background:linear-gradient(135deg, #2563eb, #1d4ed8);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
}

.back{
    background:white;
    color:#2563eb;
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
}

/* CONTAINER */
.container{
    max-width:800px;
    margin:auto;
    padding:25px 15px;
}

/* CARD */
.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
    margin-bottom:25px;
}

/* KOTAK */
.kotak{
    width:120px;
    height:120px;
    background:linear-gradient(135deg, #3b82f6, #1d4ed8);
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    margin:auto;
}

.kotak p{
    color:white;
    font-weight:bold;
}

/* SECTION KELAS */
.kelas{
    margin-bottom:20px;
}

.kelas-title{
    font-weight:700;
    color:#2563eb;
    margin-bottom:10px;
    font-size:18px;
}

/* LIST */
.list{
    list-style:none;
}

.list li{
    background:#f8fafc;
    padding:12px 15px;
    border-radius:10px;
    margin-bottom:8px;
    transition:0.2s;
}

.list li:hover{
    background:#e2e8f0;
    transform:translateX(5px);
}

/* RESPONSIVE */
@media(max-width:600px){
    .header{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>

</head>
<body>

<div class="header">
    <a href="../index.html" class="back">⬅ Kembali</a>
    <h2>Materi 1 - Kotak</h2>
</div>

<div class="container">

    <!-- CARD KOTAK -->
    <div class="card">
        <h3 style="margin-bottom:15px;">Contoh Kotak</h3>
        <div class="kotak">
            <p>Halo</p>
        </div>
    </div>

    <!-- DATA SISWA -->
    <div class="card">
        <h3 style="margin-bottom:15px;">Siswa Selesai</h3>

        <div class="kelas">
            <div class="kelas-title">X - TKJ</div>
            <ul class="list">
                <li>Febri Putri Brilianto</li>
                <li>Kaniatus Syarifah</li>
            </ul>
        </div>

        <div class="kelas">
            <div class="kelas-title">XI - TKJ</div>
            <ul class="list">
                <li>Andhes Prakoso</li>
                <li>Dwi Rahayu Ningsih</li>
                <li>Juliana Jolie</li>
                <li>Rizki Maulana</li>
                <li>Rafi Abdul Ghaniyy</li>
            </ul>
        </div>

    </div>

</div>

</body>
</html>
