<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi 2</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */
.header{
    background:linear-gradient(135deg, #2563eb, #1d4ed8);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
}

.back{
    background:white;
    color:#2563eb;
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
}

/* CONTAINER */
.container{
    max-width:800px;
    margin:auto;
    padding:25px 15px;
}

/* CARD */
.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.06);
    margin-bottom:25px;
}

/* GROUP KOTAK */
.kotak-group{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

/* KOTAK */
.kotak{
    width:120px;
    height:120px;
    background:linear-gradient(135deg, #3b82f6, #1d4ed8);
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    color:white;
    font-size:40px;
    font-weight:bold;
    transition:0.3s;
}

.kotak:hover{
    transform:scale(1.05);
}

/* RESPONSIVE */
@media(max-width:600px){
    .header{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>

</head>
<body>

<div class="header">
    <a href="../index.html" class="back">⬅ Kembali</a>
    <h2>Materi 2 - 2 Kotak</h2>
</div>

<div class="container">

    <div class="card">
        <h3 style="margin-bottom:15px;">Contoh 2 Kotak</h3>

        <div class="kotak-group">
            <div class="kotak">1</div>
            <div class="kotak">2</div>
        </div>
    </div>

</div>

</body>
</html>
