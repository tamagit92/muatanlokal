<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menampilkan Gambar</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        img {
            width: 300px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Contoh Gambar</h1>

        <!-- Ganti nama file sesuai gambar Anda -->
        <img src="hero.png" alt="Gambar Contoh">

    </div>

</body>
</html>
